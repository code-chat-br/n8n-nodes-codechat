<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <!-- Fundo principal -->
    <radialGradient id="bgGradient" cx="38%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#007b69"/>
      <stop offset="48%" stop-color="#005f53"/>
      <stop offset="100%" stop-color="#003d37"/>
    </radialGradient>

    <!-- Anel externo -->
    <linearGradient id="outerRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#008b80"/>
      <stop offset="55%" stop-color="#008f82"/>
      <stop offset="100%" stop-color="#006c63"/>
    </linearGradient>

    <!-- Anel interno -->
    <linearGradient id="innerRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58f4c0"/>
      <stop offset="50%" stop-color="#24d9a4"/>
      <stop offset="100%" stop-color="#00a98d"/>
    </linearGradient>

    <!-- Linha inferior -->
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#28dba5"/>
      <stop offset="50%" stop-color="#63f7c8"/>
      <stop offset="100%" stop-color="#25d9a4"/>
    </linearGradient>

    <!-- Sombra interna discreta -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="5"
        flood-color="#001f1b"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <!-- Círculo externo -->
  <circle
    cx="256"
    cy="256"
    r="244"
    fill="url(#outerRing)"
  />

  <!-- Espaço escuro entre os anéis -->
  <circle
    cx="256"
    cy="256"
    r="229"
    fill="#004f48"
  />

  <!-- Anel verde brilhante -->
  <circle
    cx="256"
    cy="256"
    r="220"
    fill="none"
    stroke="url(#innerRing)"
    stroke-width="13"
  />

  <!-- Fundo -->
  <circle
    cx="256"
    cy="256"
    r="209"
    fill="url(#bgGradient)"
    filter="url(#innerShadow)"
  />

  <!-- CODE -->
  <text
    x="256"
    y="203"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="94"
    font-weight="700"
    letter-spacing="-3"
  >
    CODE
  </text>

  <!-- CHAT -->
  <text
    x="256"
    y="302"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="94"
    font-weight="700"
    letter-spacing="-3"
  >
    CHAT
  </text>

  <!-- Linha inferior -->
  <rect
    x="165"
    y="348"
    width="182"
    height="5"
    rx="2.5"
    fill="url(#lineGradient)"
  />
</svg>