<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<defs>
		<radialGradient id="bgGradient" cx="38%" cy="25%" r="85%">
			<stop offset="0%" stop-color="#00a88c" />
			<stop offset="48%" stop-color="#007869" />
			<stop offset="100%" stop-color="#005047" />
		</radialGradient>

		<linearGradient id="outerRing" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#22f0c3" />
			<stop offset="55%" stop-color="#16caa8" />
			<stop offset="100%" stop-color="#039b86" />
		</linearGradient>

		<linearGradient id="innerRing" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#b8ffe8" />
			<stop offset="50%" stop-color="#65f5c8" />
			<stop offset="100%" stop-color="#1bd3a8" />
		</linearGradient>

		<linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#69f8ce" />
			<stop offset="50%" stop-color="#d4fff1" />
			<stop offset="100%" stop-color="#49ecc0" />
		</linearGradient>

		<filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#002d27" flood-opacity="0.45" />
		</filter>
	</defs>

	<circle cx="256" cy="256" r="244" fill="url(#outerRing)" />
	<circle cx="256" cy="256" r="229" fill="#003d37" />
	<circle cx="256" cy="256" r="220" fill="none" stroke="url(#innerRing)" stroke-width="13" />
	<circle cx="256" cy="256" r="209" fill="url(#bgGradient)" filter="url(#innerShadow)" />

	<text
		x="256"
		y="203"
		text-anchor="middle"
		fill="#ffffff"
		font-family="Arial, Helvetica, sans-serif"
		font-size="94"
		font-weight="700"
		letter-spacing="-3"
	>
		CODE
	</text>

	<text
		x="256"
		y="302"
		text-anchor="middle"
		fill="#ffffff"
		font-family="Arial, Helvetica, sans-serif"
		font-size="94"
		font-weight="700"
		letter-spacing="-3"
	>
		CHAT
	</text>

	<rect x="165" y="348" width="182" height="5" rx="2.5" fill="url(#lineGradient)" />
</svg>
